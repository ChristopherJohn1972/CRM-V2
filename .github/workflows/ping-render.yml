name: Keep Render Alive

on:
  schedule:
    # GitHub Actions minimum interval is 5 minutes
    # Runs every 5 minutes to prevent Render cold starts
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_BACKEND_URL }}/api/health"
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
