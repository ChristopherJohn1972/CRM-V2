services:
  - type: web
    name: crm-backend
    runtime: python
    plan: free
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: crm-backend.onrender.com
      - key: CRM_DB_HOST
        fromDatabase:
          name: crm-mysql
          property: host
      - key: CRM_DB_PORT
        fromDatabase:
          name: crm-mysql
          property: port
      - key: CRM_DB_NAME
        fromDatabase:
          name: crm-mysql
          property: database
      - key: CRM_DB_USER
        fromDatabase:
          name: crm-mysql
          property: user
      - key: CRM_DB_PASSWORD
        fromDatabase:
          name: crm-mysql
          property: password
      - key: CRM_JWT_SECRET
        generateValue: true
      - key: CRM_OPENAI_API_KEY
        sync: false
      - key: CRM_SCOUT_SECURITY_EMAIL
        sync: false
      - key: CRM_CORS_ORIGINS
        sync: false

databases:
  - name: crm-mysql
    plan: free
    databaseName: crm_v2
    ipAllowList: []
